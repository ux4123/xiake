# Claw's Trainer — GitHub Actions 自动构建
# 
# 使用方法：
# 1. 将本项目推送到 GitHub 仓库
# 2. 在 GitHub 仓库页面点击 Actions → build.yml → Run workflow
# 3. 等待 3-5 分钟，构建完成
# 4. 下载 Artifacts 中的 ClawTrainer.exe
#
# 或者每次推送到 main 分支时自动构建

name: Build ClawTrainer.exe

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ "main" ]    # 推送 main 分支时自动构建

jobs:
  build:
    runs-on: windows-latest   # 使用 GitHub 的 Windows 云构建机
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pymem psutil pyinstaller

      - name: 🔨 用 PyInstaller 打包
        run: |
          pyinstaller trainer.spec --clean --noconfirm
        working-directory: ${{ github.workspace }}

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ClawTrainer-${{ github.sha }}
          path: dist/ClawTrainer.exe
          if-no-files-found: error
          retention-days: 30   # 保留 30 天
